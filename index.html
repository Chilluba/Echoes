<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes — Momentum Trading Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="header">
            <h1>Echoes — Momentum Trading Game</h1>
            <div class="player-info">
                <span>Balance: <span id="balance">1000</span></span>
                <span>Winnings: <span id="winnings">0</span></span>
            </div>
        </div>

        <div id="canvas-wrapper">
            <div id="game-canvas"></div>
            <div id="multiplier-display">
                <div id="countdown-timer"></div>
                <div id="multiplier-value">--.--x</div>
            </div>
        </div>

        <div id="controls">
            <div class="bet-controls">
                <label for="bet-amount">Bet Amount:</label>
                <input type="number" id="bet-amount" value="10" min="10" max="500" step="10">
            </div>
            <button id="action-button">Place Bet</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
